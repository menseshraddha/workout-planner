<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A simple daily workout planner based on your goals, equipment and schedule.">
<meta name="theme-color" content="#4A8FE7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sweat &amp; Smile">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sweat &amp; Smile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow phone column. Today / Progress / Profile tabs in a fixed dock; the workout timer bar sits above the tabs while a session runs. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#121A2B; --muted:#586277; --line:#D9DFE9;
  --accent:#2845F5; --on-accent:#FFFFFF; --soft:#E4E9FF;
  --good:#13805A; --on-good:#FFFFFF; --good-soft:#DDF3EA; --warn:#A85C00;
  --f-display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1320; --surface:#171E2F; --ink:#EDF0F7; --muted:#9BA5BB; --line:#2A334B;
    --accent:#8EA0FF; --on-accent:#0E1320; --soft:#222C52;
    --good:#4FD6A1; --on-good:#0E1320; --good-soft:#16372F; --warn:#F0B35A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#171E2F; --ink:#EDF0F7; --muted:#9BA5BB; --line:#2A334B;
  --accent:#8EA0FF; --on-accent:#0E1320; --soft:#222C52;
  --good:#4FD6A1; --on-good:#0E1320; --good-soft:#16372F; --warn:#F0B35A; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 0}
.app{max-width:480px;margin:0 auto;padding-bottom:190px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:16px}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.top h1{font-size:34px;font-weight:800;letter-spacing:-.02em}
.streak{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-mono);font-weight:700;font-size:15px;white-space:nowrap}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted);min-width:0;background:none;border:0;padding:4px 0;border-radius:10px}
.wd.sel{background:var(--soft)}
.wd.sel span{color:var(--ink);font-weight:700}
.preview .chk{opacity:.35}
.down{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:none;color:var(--muted);display:grid;place-items:center;padding:0}
.down svg{width:20px;height:20px}
.down:hover,.down:focus-visible{color:var(--warn);border-color:var(--warn)}
.swapnote{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--soft);padding:10px 12px;border-radius:10px;font-size:14px;margin:8px 0}
.swapnote>span{min-width:0}
.swaprow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
.swaprow:first-of-type{border-top:0}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand img{width:56px;height:56px;border-radius:14px;flex:none}
.bname{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.btag{color:var(--muted);font-size:14px}
.goal{display:flex;flex-direction:column;gap:10px}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.gd{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:16px}
.gd.on{background:var(--good);border-color:var(--good);color:var(--on-good)}
.gd.pass{border-color:var(--accent);background:var(--soft)}
.wd.pass i{border-color:var(--accent);background:var(--soft)}
.level{background:var(--soft);border-color:transparent;display:flex;gap:12px;align-items:center;justify-content:space-between}
.mood{margin-top:14px}
.moods{display:flex;gap:8px;margin-top:6px}
.mbtn{flex:1;min-height:52px;font-size:28px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0}
.mbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.music{display:inline-flex;gap:6px;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;background:var(--soft);color:var(--ink);font-weight:700;font-size:15px;text-decoration:none}
.tog{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.tog[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.win{border-radius:16px;padding:18px;background:linear-gradient(135deg,#2845F5,#6A3FD8);color:#fff;display:flex;flex-direction:column;gap:8px}
.win .eyebrow{color:#DCE2FF}
.bubble{background:var(--soft);border-radius:14px;padding:12px 14px}
.sharebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sharebtns .btn{min-height:46px;padding:0 10px;font-size:15px;text-decoration:none}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px}
.bd{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.bd i{font-style:normal;font-size:28px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--soft)}
.bd b{font-size:13px;line-height:1.2}
.bd span{font-size:11px;color:var(--muted);line-height:1.25}
.bd.lock i{filter:grayscale(1);opacity:.4}
.bd.lock b{color:var(--muted)}
.trow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.temo{font-size:28px}
.tbig{font-family:var(--f-mono);font-size:64px;font-weight:700;text-align:center;letter-spacing:-.03em}
.tcount{min-height:130px;font-size:24px;border-radius:20px}
.safety{background:var(--soft);border-left:4px solid var(--warn);padding:12px;border-radius:10px;font-size:14px}
.focus{border:2px solid var(--accent);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--surface);margin-top:14px}
.focus h2{font-size:30px}
body.hf{font-size:20px}
body.hf .sname{font-size:24px}
body.hf .scheme{font-size:18px}
body.hf .cue{font-size:18px}
body.hf .btn{min-height:60px;font-size:20px}
body.hf .chk{width:56px;height:56px}
body.hf .step{grid-template-columns:56px minmax(0,1fr) auto}
body.hf .top h1{font-size:40px}
body.hf .nav button{font-size:14px}
.wd i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:14px;border:1.5px solid var(--line)}
.wd.plan i{border-color:var(--accent);color:var(--accent)}
.wd.done i{background:var(--good);border-color:var(--good);color:var(--on-good);font-weight:700}
.wd.today span{color:var(--ink);font-weight:700}
.wd.today i{box-shadow:0 0 0 3px var(--soft)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.card.plain{background:transparent;border-style:dashed}
.recap{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--soft);border-color:transparent}
.recap strong{font-family:var(--f-mono)}
.linkbtn{background:none;border:0;padding:6px 2px;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.plan h2{font-size:30px;font-weight:800;letter-spacing:-.02em}
.tag{margin-top:4px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.pill{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--ink)}
.note{font-size:14px;color:var(--muted);margin-bottom:6px}
.phase{margin:18px 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.steps{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.step:first-child{border-top:0}
.chk{width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);background:transparent;display:grid;place-items:center;color:var(--on-good);padding:0}
.chk svg{width:22px;height:22px;opacity:0}
.step.on .chk{background:var(--good);border-color:var(--good)}
.step.on .chk svg{opacity:1}
.step.on .sname{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.step.locked .chk{border-color:var(--line)}
.sname{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.2}
.scheme{display:inline-block;margin-top:4px;font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--accent)}
.rest{font-size:13px;color:var(--muted);margin-left:8px}
.cue{margin-top:4px;font-size:14px;color:var(--muted)}
.how{display:inline-block;margin-top:6px;padding:4px 0;font-size:14px;font-weight:600;color:var(--accent);text-underline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--on-good)}
.btn.block{width:100%}
.cta{display:flex;flex-direction:column;gap:10px;margin-top:16px;align-items:stretch}
.cta .linkbtn{align-self:center}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress>b{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.done-card{background:var(--good-soft);border-color:transparent}
.done-card h2{font-size:28px}
.done-card .big{font-family:var(--f-mono);font-size:40px;font-weight:700;letter-spacing:-.02em;margin:8px 0 4px}
details summary{cursor:pointer;font-weight:600;color:var(--accent);padding:6px 0}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock-in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--soft)}
.bar .clock{font-family:var(--f-mono);font-weight:700;font-size:26px;letter-spacing:-.02em;flex:1;min-width:0}
.bar .btn{min-height:42px;padding:0 14px;font-size:15px}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;color:var(--muted);font-size:12px;font-weight:600}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent)}

/* toast + confetti */
.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 12px);margin:0 auto;max-width:440px;z-index:20;
  background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;text-align:center;opacity:0;transform:translateY(-12px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:none}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:15}
.confetti span{position:absolute;top:-40px;font-size:26px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.8}}
@media (prefers-reduced-motion:reduce){.toast,.progress>b{transition:none}.confetti{display:none}}

/* progress */
.hero{font-family:var(--f-mono);font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-width:0}
.stat b{display:block;font-family:var(--f-mono);font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px;margin-top:12px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:11px;color:var(--muted);min-width:0}
.col .v{font-family:var(--f-mono);font-size:11px;color:var(--ink)}
.col .b{width:100%;max-width:30px;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:3px}
.col .b.zero{background:var(--line)}
.wk{display:grid;grid-template-columns:96px minmax(0,1fr) 64px;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.wk .trk{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.wk .trk b{display:block;height:100%;background:var(--accent);border-radius:99px}
.wk .n{font-family:var(--f-mono);font-weight:700;text-align:right;font-size:13px}
.wk.cur{font-weight:700}

/* form */
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.field>.lbl{font-weight:700;font-size:15px}
input[type=text],input[type=number],input[type=time]{height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;width:100%;min-width:0}
.row{display:flex;gap:10px;align-items:flex-end}
.row>*{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.calrow{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.calrow:first-child{border-top:0}
.cday{font-weight:700}
.ctime{font-family:var(--f-mono);font-weight:700;font-size:14px}
.err{color:var(--warn);font-weight:600;font-size:14px}
.err:empty{display:none}
.req{color:var(--warn);font-weight:700}
.opt{font-weight:500;color:var(--muted);font-size:13px}
input[aria-invalid="true"]{border-color:var(--warn)}
textarea{width:100%;min-height:120px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font-family:var(--f-mono);font-size:12px}
.hint{font-size:13px;color:var(--muted)}
.fact{font-size:14px;color:var(--ink);background:var(--soft);padding:10px 12px;border-radius:10px;margin:0}
.fact:empty{display:none}
a.btn{text-decoration:none}
</style>
</head>
<body>

<div class="app" id="view"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="dock" id="dock" hidden>
  <div class="dock-in">
    <div class="bar" id="bar" hidden></div>
    <nav class="nav" aria-label="Sections">
      <button type="button" data-act="tab" data-tab="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>Today</button>
      <button type="button" data-act="tab" data-tab="progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Progress</button>
      <button type="button" data-act="tab" data-tab="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profile</button>
    </nav>
  </div>
</div>

<script>
/* ---------- constants ---------- */
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAYFULL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const BYDAY=['MO','TU','WE','TH','FR','SA','SU'];
const GOALS=[['strength','Strength & muscle'],['fat','Fat loss & general fitness'],['endurance','Endurance']];
const STYLES=[['bodyweight','Bodyweight strength'],['gym','Gym'],['running','Running'],['yoga','Yoga'],['dance','Zumba / dance'],['pilates','Pilates']];
const EQUIP=[['dumbbells','Dumbbells'],['kettlebell','Kettlebell'],['bands','Resistance bands'],['pullbar','Pull-up bar'],['rack','Squat rack / barbell'],['treadmill','Treadmill'],['rower','Rowing machine'],['bike','Stationary bike'],['elliptical','Elliptical'],['gym','Full gym access']];
const EQLABEL={dumbbells:'Dumbbells',kettlebell:'Kettlebell',bands:'Bands',pullbar:'Pull-up bar',rack:'Rack',treadmill:'Treadmill',rower:'Rower',bike:'Bike',elliptical:'Elliptical',gym:'Gym'};
const INJ=[['knees','Knees'],['back','Lower back'],['shoulders','Shoulders'],['wrists','Wrists'],['ankles','Ankles'],['floor','Trouble getting down to or up from the floor']];
const LEVELS=[['beginner','Beginner'],['intermediate','Intermediate'],['advanced','Advanced']];
const LENS=[15,30,45,60];
const STYLE_ORDER=['running','yoga','dance','pilates'];
const TEMPLATES={1:['full'],2:['full','style'],3:['full','style','full'],4:['upper','lower','style','core'],
  5:['push','pull','legs','style','core'],6:['push','pull','legs','core','style','mobility'],7:['push','pull','legs','core','style','full','mobility']};
const META={
  push:['Push day','Chest · shoulders · triceps'],pull:['Pull day','Back · biceps · rear shoulders'],legs:['Leg day','Quads · glutes · hamstrings · calves'],
  core:['Core day','Abs · obliques · lower back'],upper:['Upper body','Chest · back · shoulders · arms'],lower:['Lower body','Quads · glutes · hamstrings · calves'],
  full:['Full body','Legs · push · pull · core · cardio'],cardio:['Cardio circuit','Heart rate up, joints friendly'],mobility:['Recovery & mobility','Stretch, loosen up, reset'],
  running:['Run / walk intervals','Aerobic base builder'],yoga:['Yoga flow','Strength, balance, calm'],dance:['Dance cardio','Zumba-style, no experience needed'],pilates:['Pilates','Deep core and control']
};

/* ---------- exercise library ---------- */
// id, name, focus, type (r reps / s seconds), values per level [beg,int,adv], difficulty, equipment, high-impact, avoid-if-injured, cue, unilateral
const X=(id,n,f,t,v,d,eq,hi,av,c,u)=>({id,n,f,t,v,d,eq,hi:!!hi,av:av||[],c,u:!!u});
const LIB=[
X('wallpush','Wall push-up','push','r',[12,15,20],1,'none',0,[],'Hands on a wall, body in one line, bring your chest to the wall.'),
X('inclinepush','Incline push-up','push','r',[8,12,15],1,'none',0,['wrists'],'Hands on a sturdy table or sofa edge. Lower your chest, press tall.'),

/* ---------- date helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dow=d=>(d.getDay()+6)%7;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const startOfDay=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const mondayOf=d=>addDays(startOfDay(d),-dow(d));
const parseKey=k=>{const a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const fmtShort=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- plan engine (deterministic: the same weekday always gets the same session) ---------- */
function level(p){let L={beginner:1,intermediate:2,advanced:3}[p.level]||1;if(p.age<18||p.age>=60)L=Math.min(L,2);if(p.age>=75)L=1;return L;}
function kgOf(p){return p.unit==='lb'?p.weight*0.4536:p.weight;}
function lowImpact(p){return p.age>=60||kgOf(p)>=110||p.injuries.includes('knees')||p.injuries.includes('ankles');}
let CUR=null;
function hasEq(e,p){
  if(e.eq==='none')return true;
  const need=Array.isArray(e.eq)?e.eq:[e.eq];
  return need.some(x=>p.equip.includes(x))||p.equip.includes('gym');
}
function gearOf(e){
  if(e.eq==='none')return null;
  const need=Array.isArray(e.eq)?e.eq:[e.eq],eqp=(CUR&&CUR.equip)||[];
  return need.find(x=>eqp.includes(x))||(eqp.includes('gym')?'gym':need[0]);
}
function eligible(e,p,L,lo){
  return e.d<=L&&!e.av.some(a=>p.injuries.includes(a))&&!(lo&&e.hi)&&hasEq(e,p)&&
    !(p.injuries.includes('floor')&&FLOOR.has(e.id))&&!(p.age>=60&&SENIOR_SKIP.has(e.id));
}
function rank(list,L,p){
  return list.map((e,i)=>({e,s:Math.abs(e.d-L)*10+(e.eq!=='none'?-3:0)-(p&&p.age>=60&&SENIOR_PREF.has(e.id)?6:0)+i*0.01})).sort((a,b)=>a.s-b.s).map(x=>x.e);
}
function roundRobin(lists){
  const out=[];const m=Math.max(0,...lists.map(l=>l.length));
  for(let i=0;i<m;i++)lists.forEach(l=>{if(l[i])out.push(l[i]);});
  return out;
}
function poolFor(focus,p,L,lo,off){
  const get=f=>rank(LIB.filter(e=>e.f===f&&eligible(e,p,L,lo)),L,p);
  const rot=l=>l.length&&off?l.slice(off%l.length).concat(l.slice(0,off%l.length)):l;
  switch(focus){
    case 'upper':return roundRobin([get('push'),get('pull')]);
    case 'lower':return get('legs');
    case 'full':return roundRobin([rot(get('legs')),rot(get('push')),rot(get('pull')),rot(get('core')),rot(get('cardio'))]);
    default:return get(focus);
  }
}

  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2300);
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('div');c.className='confetti';
  const em=['🎉','💪','🔥','⭐','🏆','✨','🥳'];
  for(let i=0;i<22;i++){const s=document.createElement('span');s.textContent=em[i%em.length];s.style.left=Math.random()*96+'%';s.style.animationDelay=Math.random()*.7+'s';c.appendChild(s);}
  document.body.appendChild(c);setTimeout(()=>c.remove(),3400);
}

function downBtn(st){return '<button type="button" class="down" data-act="down" data-id="'+esc(st.ex)+'" aria-label="Swap out '+esc(st.name)+': too hard or cannot do it" title="Too hard or can’t do it? Swap it">'+THUMB+'</button>';}
function swapNote(sel){
  if(lastSwap&&lastSwap.day===sel)return '<div class="swapnote"><span>Swapped <b>'+esc(lastSwap.from)+'</b> for <b>'+esc(lastSwap.to)+'</b> on every day that includes it.</span><button type="button" class="linkbtn" data-act="undoswap">Undo</button></div>';
  return '<p class="hint" style="margin:6px 0">Too hard, or can’t do a move? Tap the thumbs-down next to it to swap it for another.</p>';
}
function swappedCard(){
  const ids=(state.disliked||[]).filter(id=>LIB.some(e=>e.id===id));
  if(!ids.length)return '';
  return '<div class="card stack"><h3>Swapped-out exercises</h3><p class="muted small">These are replaced in your plan. Bring one back any time.</p>'+
    ids.map(id=>'<div class="swaprow"><span>'+esc(LIB.find(x=>x.id===id).n)+'</span><button type="button" class="linkbtn" data-act="restore" data-id="'+esc(id)+'">Bring back</button></div>').join('')+'</div>';
}
function changeDislikes(fn){
  const ti=dow(new Date()),s0=todaySession(getPlan()[ti]);
  fn();planCache=null;
  const ta=getPlan()[ti];
  if(s0&&ta){s0.sig=ta.sig;s0.checked=s0.checked.filter(x=>ta.steps.some(st=>st.id===x));}
  save();
}
function stepsHtml(w,s,readonly,swap){
  let html='<ul class="steps">',last='';
  const labels={warm:'Warm-up',main:'Main set',finish:'Finisher',cool:'Cool-down'};
  const hasPhases=w.steps.some(x=>x.phase!=='main');
  w.steps.forEach(st=>{
    if(hasPhases&&st.phase!==last){html+='</ul><div class="phase">'+labels[st.phase]+'</div><ul class="steps">';last=st.phase;}
    const on=s&&s.checked.includes(st.id),locked=!s&&!readonly;
    html+='<li class="step'+(on?' on':'')+(locked?' locked':'')+'"><button type="button" class="chk" data-act="step" data-id="'+esc(st.id)+'" aria-pressed="'+(!!on)+'" aria-label="Mark '+esc(st.name)+' complete"'+(readonly?' disabled':'')+'>'+CHECK+'</button><div>'+
      '<div class="sname">'+esc(st.name)+'</div><div><span class="scheme">'+esc(st.scheme)+'</span>'+(st.rest?'<span class="rest">rest '+st.rest+' sec</span>':'')+(st.swappedFrom?'<span class="rest">swapped in for '+esc(st.swappedFrom)+'</span>':'')+'</div>'+
      '<div class="cue">'+esc(st.cue)+'</div><a class="how" href="https://www.youtube.com/results?search_query='+encodeURIComponent(st.q||('how to do '+st.name))+'" target="_blank" rel="noopener">▶ Watch how on YouTube</a></div>'+(swap&&st.ex?downBtn(st):'')+'</li>';
  });
  return html+'</ul>';
}
function renderToday(){

    '<div class="streak" title="Workouts this week">🎯 '+wm.c+'/'+weekGoal()+'</div></header>';
  h+='<div class="week" aria-label="This week">';
  for(let i=0;i<7;i++){
    const d=addDays(mon,i),l=state.log[key(d)],sched=p.days.includes(i),past=d<startOfDay(now)&&d>=created,pd=!l&&state.rest&&state.rest[key(mon)]===key(d);
    const cls=l?'done':pd?'pass':sched?(past?'missed':'plan'):'rest';
    h+='<button type="button" class="wd '+cls+(i===dow(now)?' today':'')+(i===sel?' sel':'')+'" data-act="day" data-day="'+i+'" aria-pressed="'+(i===sel)+'" aria-label="'+DAYFULL[i]+(sched?', workout day':', rest day')+'"><span>'+DAYS[i]+'</span><i>'+(l?'✓':pd?'😴':sched?(past?'–':'•'):'')+'</i></button>';
  }
  h+='</div><div class="stack">';
  if(isToday)h+=levelCard();
  h+=goalCard(now,mon);
  const lastMon=addDays(mon,-7),lw=weekMinutes(lastMon);
  if(lw.t>0&&state.dismissed!==key(lastMon)){
    h+='<div class="card recap"><div><p class="eyebrow">Last week</p><p><strong>'+lw.t+' min</strong> across '+lw.c+' workout'+(lw.c===1?'':'s')+(lw.est?' (some estimated)':'')+'. Nice work 🙌</p></div><button type="button" class="linkbtn" data-act="dismiss">Dismiss</button></div>';

      h+='<h2>Rest day 🧘</h2><p class="muted" style="margin-top:8px">'+(log?'You still logged '+log.min+' min. Bonus points! 🌟':'No workout planned.')+'</p>';
    }else{
      h+='<h2>'+esc(w.title)+'</h2><p class="tag">'+esc(w.tag)+'</p><div class="meta"><span class="pill">'+w.min+' min</span><span class="pill">'+w.level+'</span>'+
        (log?'<span class="pill" style="background:var(--good-soft)">Done · '+log.min+' min ✓</span>':(past&&sd>=created)?'<span class="pill">Missed</span>':'')+'</div><p class="note">'+esc(w.note)+'</p>'+musicLink(w)+swapNote(sel)+stepsHtml(w,null,true,!log);
    }
    h+='<div class="cta"><button type="button" class="btn ghost block" data-act="day" data-day="'+dow(now)+'">Back to today</button></div></section>';
  }else if(!w){
    let next=null;
    for(let i=1;i<=7&&!next;i++){const dd=(dow(now)+i)%7;if(plan[dd])next=[i,dd];}
    h+='<div class="card plain"><h2>Rest day 🧘</h2><p class="muted" style="margin-top:8px">'+esc(say(REST_TIPS[now.getDate()%REST_TIPS.length]))+'</p>'+
      (next?'<p style="margin-top:14px"><span class="eyebrow">Next up</span><br><strong>'+(next[0]===1?'Tomorrow':DAYFULL[next[1]])+'</strong> · '+esc(plan[next[1]].title)+' · '+plan[next[1]].min+' min</p>':'')+'</div>';
    h+='<p class="muted small">This week so far: <strong>'+wm.t+' min</strong></p>';
  }else if(log){
    h+='<div class="card done-card"><p class="eyebrow">'+esc(w.title)+'</p><h2>Workout done, '+esc(p.name)+'! 🎉</h2><div class="big">'+log.min+' min</div>'+
      '<p>'+(log.est?'Marked done without the timer, so this is the planned time.':'Timed from start to finish.')+' This week: <strong>'+wm.c+' of '+weekGoal()+'</strong> workouts 🎯</p>'+

  }

  h+='<p class="hint">General fitness suggestions, not medical advice. Stop if something hurts, and check with a doctor if you have a health condition.'+(p.age>=60?' At 60 and over, it is a good idea to check with your doctor before starting a new routine.':'')+'</p>';
  if(!storageOk)h+='<p class="hint">This browser is not saving data right now, so progress may be lost when you close the page.</p>';
  h+='</div>';

    '<div class="progress"><b style="width:'+Math.min(100,Math.round(wm.t/Math.max(planned,1)*100))+'%"></b></div></div>';
  h+='<div class="stats"><div class="stat"><b>'+wm.c+'/'+p.days.length+'</b><span>workouts</span></div><div class="stat"><b>'+weeksOnGoal()+'</b><span>weeks on goal</span></div><div class="stat"><b>'+totalAll()+'</b><span>total min</span></div></div>';

    (wk.some(x=>x.est)?'<p class="hint" style="margin-top:6px">~ includes workouts marked done without the timer.</p>':'')+'</div></div>';
  $('#view').innerHTML=h;
}

/* ---------- render: dock + root ---------- */
function renderDock(){
  const dock=$('#dock'),bar=$('#bar');
  const ready=!!(state.profile&&state.profile.name);
  dock.hidden=!ready||tab==='calendar';
  document.querySelectorAll('.nav button').forEach(b=>{if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  const w=ready?getPlan()[dow(new Date())]:null;
  const s=w&&!state.log[key(new Date())]?todaySession(w):null;
  if(!s){bar.hidden=true;bar.innerHTML='';return;}
  const all=s.checked.length===w.steps.length;
  bar.hidden=false;
  bar.innerHTML='<span class="clock" id="clock" aria-label="Elapsed time">'+fmtClock(elapsed(s))+'</span>'+
    '<button type="button" class="btn ghost" data-act="'+(s.runStart?'pause':'resume')+'">'+(s.runStart?'Pause':'Resume')+'</button>'+
    '<button type="button" class="btn '+(all?'good':'')+'" data-act="finish">Finish</button>';
}
function render(){
  if(!state.profile||!state.profile.name)tab='profile';
  document.body.classList.toggle('hf',!!state.handsfree);
  if(tab==='today')renderToday();else if(tab==='progress')renderProgress();else if(tab==='calendar')renderCalendar();else if(tab==='test')renderTest();else renderProfile();
  renderDock();
}

/* ---------- actions ---------- */
function curWorkout(){return getPlan()[dow(new Date())];}
function complete(w,min,est){
  const tk=key(new Date());
  state.log[tk]={min,est:!!est,title:w.title};
  state.session=null;state.lastMeme=pick(MEMES);save();
  restEnd=0;hfSets={};const nb=checkBadges();
  tab='today';viewDay=null;render();confetti();toast(nb?'New badge: '+nb:pick(ENC_DONE));window.scrollTo(0,0);
}
const actions={
  tab(el){tab=el.dataset.tab;viewDay=null;lastSwap=null;testing=null;if(tab!=='profile')draft=null;render();window.scrollTo(0,0);},
  down(el){
    const id=el.dataset.id;state.disliked=state.disliked||[];
    if(state.disliked.includes(id))return;
    const day=viewDay===null?dow(new Date()):viewDay,before=getPlan()[day];
    const idx=before.steps.findIndex(st=>st.ex===id),oldName=idx>=0?before.steps[idx].name:'';
    changeDislikes(()=>state.disliked.push(id));
    const after=getPlan()[day];
    if(after.steps.some(st=>st.ex===id)){changeDislikes(()=>state.disliked.pop());toast('No swap is available for this one. Check your injuries and equipment in Profile.');return;}

  restore(el){

  lvlok(){state.lvlSeen=key(mondayOf(new Date()));save();render();},

  tstart(){testing.phase='run';testing.start=Date.now();testing.count=0;render();},
  tcount(){testing.count++;const e=$('#tcnt');if(e)e.textContent=testing.count;},

  tskip(){testing=null;tab='progress';render();window.scrollTo(0,0);},
  tredo(){testing.phase='intro';render();},

    state.tests=state.tests||{};const arr=state.tests[t.id]=state.tests[t.id]||[];

  },

  }

function readForm(){
  draft.name=$('#f-name').value.trim();draft.age=$('#f-age').value;draft.weight=$('#f-weight').value;draft.time=$('#f-time').value;
}
function fieldErrors(d){
  const e={},age=+d.age,wt=+d.weight,lo=d.unit==='lb'?44:20,hi=d.unit==='lb'?880:400;
  if(!String(d.name||'').trim())e.name='Enter your first name.';
  if(!(age>=10&&age<=99))e.age='Enter an age between 10 and 99.';
  if(!(wt>=lo&&wt<=hi))e.weight='Enter your weight ('+lo+' to '+hi+' '+(d.unit==='lb'?'lb':'kg')+').';
  if(!d.goals.length)e.goals='Pick at least one goal.';
  if(!d.styles.length)e.styles='Pick at least one workout style.';
  if(!d.days.length)e.days='Pick at least one workout day.';
  if(!/^\d\d:\d\d$/.test(d.time||''))e.time='Choose a workout time.';
  return e;
}
const REQ_KEYS=['name','age','weight','goals','styles','days','time'];
function showErrors(e){
  REQ_KEYS.forEach(k=>{const el=$('#e-'+k);if(el)el.textContent=e[k]||'';const inp=$('#f-'+k);if(inp)inp.setAttribute('aria-invalid',e[k]?'true':'false');});
  const g=$('#formerr');if(g)g.textContent=Object.keys(e).length?'Please complete the required fields marked above.':'';
}
function saveProfile(){
  readForm();const d=draft;d.name=d.name.trim();
  const errs=fieldErrors(d);showErrors(errs);
  const firstBad=REQ_KEYS.find(k=>errs[k]);
  if(firstBad){const t=$('#f-'+firstBad)||$('#e-'+firstBad);if(t){t.scrollIntoView({block:'center'});if(t.tagName==='INPUT')t.focus();}return;}
  const age=+d.age,wt=+d.weight;
  const prev=state.profile;
  state.profile=Object.assign({},d,{age,weight:wt,created:prev?prev.created:key(new Date())});
  planCache=null;draft=null;viewDay=null;save();
  const changed=!prev||prev.time!==state.profile.time||prev.days.slice().sort().join()!==state.profile.days.slice().sort().join();
  if(changed){calMode=prev?'update':'first';calDone=false;tab='calendar';}else tab='today';
  render();window.scrollTo(0,0);
  if(prev&&!changed)toast('Plan updated ✅');
}
function markCal(){calDone=true;const b=$('#calnext');if(b)b.disabled=false;}
function runSave(){
  try{saveProfile();}catch(err){
    const g=$('#formerr');
    if(g){g.textContent='Something went wrong saving this: '+(err&&err.message||err)+'. Please tell the person who shared this app.';g.scrollIntoView({block:'center'});}
    else toast('Something went wrong: '+(err&&err.message||err));
  }
}

function init(){
  document.addEventListener('click',e=>{
    const chip=e.target.closest('.chip');
    if(chip&&draft){
      const g=chip.parentElement.dataset.group,raw=chip.dataset.v,v=(g==='len'||g==='days')?Number(raw):raw;
      if(Array.isArray(draft[g])){const i=draft[g].indexOf(v);if(i>=0)draft[g].splice(i,1);else draft[g].push(v);chip.setAttribute('aria-pressed',String(i<0));}
      else{draft[g]=v;chip.parentElement.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c===chip)));if(g==='unit'){const w=$('#f-weight');if(w)w.placeholder=v==='lb'?'e.g. 155':'e.g. 70';}}
      if(g==='days')updateDayCount();if(g==='days'||g==='len')updateFact();const er=$('#e-'+g);if(er)er.textContent='';
      return;
    }
    const sb=e.target.closest('#pf button[type=submit]');
    if(sb){e.preventDefault();runSave();return;}
    const el=e.target.closest('[data-act]');
    if(el&&actions[el.dataset.act])actions[el.dataset.act](el);
  });
  document.addEventListener('submit',e=>{if(e.target.id==='pf'){e.preventDefault();runSave();}});
  document.addEventListener('input',e=>{if(e.target.id==='f-age')updateAgeHint();const id=e.target.id||'';if(id.indexOf('f-')===0){const k=id.slice(2),er=$('#e-'+k);if(er)er.textContent='';e.target.setAttribute('aria-invalid','false');}});
  if(state.session&&state.session.date!==key(new Date()))state.session=null;
  if(state.profile&&!state.badges)state.badges=earnedIds();
  tick=setInterval(()=>{
    const c=$('#clock');if(c&&state.session&&state.session.runStart)c.textContent=fmtClock(elapsed(state.session));
    if(restEnd){if(Date.now()>=restEnd){restEnd=0;beep();speak(restSay);render();}else{const r=$('#restclock');if(r)r.textContent=fmtClock(restEnd-Date.now()+999);}}
    if(testing&&testing.phase==='run')testTick();
  },250);
  render();
}
if(typeof window!=='undefined'&&window.document)init();
</script>
